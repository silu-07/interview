<div class="container">
  <div class="card" *ngFor="let item of jsonData?.data?.children">
    <div class="card-header">
      <h2>{{ item.data.title }}</h2>
      <button class="expand-button" (click)="openCardPopup(item)">Open</button>
    </div>
    <p>{{ item.data.cleanedSelftext }}</p>
    <div class="card-footer">
      <a [href]="item.data.url" target="_blank" class="visit-link">Visit URL</a>
      <p class="score">Score: {{ item.data.score }}</p>
    </div>
  </div>
</div>
